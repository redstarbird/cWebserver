name: CI Pipeline

on:
    push:
        branches: ["master"]
    pull_request:
        branches: ["master"]

jobs:
    test-platforms:
        name: ${{ matrix.platform.name }}
        runs-on: ${{ matrix.platform.os }}

        # Create a matrix of different OS and CMake configurations to test various scenarios
        strategy:
            fail-fast: false # Allows all matrix jobs to complete even if one job fails
            matrix:
                build_type: [Debug, Release]
                platform:
                    - name: "Linux GCC (64-bit)"
                      os: ubuntu-latest
                      compiler: gcc
                      cmake_args: ""

                    - name: "Linux Clang with Address Sanitizer (64-bit)"
                      os: ubuntu-latest
                      compiler: clang
                      cmake_args: "-DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'"

                    - name: "Windows (64-bit)"
                      os: windows-latest
                      compiler: cl
                      cmake_args: ""

                    - name: "macOS (64-bit)"
                      os: macos-latest
                      compiler: clang
                      cmake_args: ""

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                  submodules: true

            - name: Install libcurl (Linux)
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

            - name: Install libcurl (macOS)
              if: runner.os == 'macOS'
              run: |
                  brew install curl

            - name: Install libcurl (Windows)
              if: runner.os == 'Windows'
              run: |
                  vcpkg install curl:x64-windows

            # Configure CMake using the specific arguments from the matrix
            - name: Configure CMake
              env:
                  CC: ${{ matrix.platform.compiler }}
              run: cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ${{ matrix.platform.cmake_args }}

            - name: Build
              run: cmake --build build --config ${{matrix.build_type}}

            # Run CTest
            - name: Run Tests
              working-directory: ./build
              run: ctest --output-on-failure -V -C ${{matrix.build_type}}
